[workspace]
resolver = "2"
members = [
  "practice-tool",
  "lib/libeldenring",
  "lib/param-tinkerer",
  "lib/no-logo",
  "lib/scripts",
  "xtask",
]

[workspace.package]
version = "1.10.0"
authors = ["Andrea Venuta <venutawebdesign@gmail.com>"]

[profile.release]
strip = "symbols"
lto = true

# Release codegen plus full debug info, so profiling builds match what ships
# but can be symbolized. Outputs to its own directory, separate from release.
[profile.profiling]
inherits = "release"
debug = 2
strip = "none"

[profile.fastdev]
inherits = "release"
debug = true
strip = "none"

[workspace.dependencies]
imgui = "0.12.0"
imgui-sys = "0.12.0"
once_cell = "1.19.0"
parking_lot = "0.12.1"
hudhook = { git = "https://github.com/soarqin/hudhook", branch = "fix/all-in-one" }
practice-tool-core = { git = "https://github.com/soarqin/practice-tool-core", branch = "i18n_zh-CN", version = "0.1.0" }
practice-tool-core-windows = { git = "https://github.com/soarqin/practice-tool-core", branch = "i18n_zh-CN", version = "0.1.0" }
practice-tool-memedit = { git = "https://github.com/soarqin/practice-tool-core", branch = "i18n_zh-CN", version = "0.1.0" }
practice-tool-tasks = { git = "https://github.com/soarqin/practice-tool-core", branch = "i18n_zh-CN", version = "0.1.0" }
macro-param = { git = "https://github.com/soarqin/practice-tool-core", branch = "i18n_zh-CN", version = "0.1.0" }

[workspace.dependencies.windows]
version = "0.62.0"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
]

